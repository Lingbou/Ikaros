name: Feature request
description: Propose a focused Ikaros improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete terminal-agent problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest implementation and its safety boundary.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - terminal-ui
        - agent-runtime
        - openai-provider
        - tools-and-approval
        - session-storage
        - build-and-docs
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This improves the current minimal product rather than restoring a removed legacy surface.
          required: true
