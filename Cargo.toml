[package]
name = "ikaros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/lingbou/Ikaros"
authors = ["Ikaros contributors"]
description = "A small terminal-first local agent"

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3"
clap = { version = "4.5", features = ["derive"] }
command-group = { version = "5.0", features = ["with-tokio"] }
crossterm = "0.28.1"
fs4 = "1.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.38", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.38", features = ["net"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
